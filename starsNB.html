<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbiting Stars Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1); /* Zoomed in (normal scale) */
      transform-origin: center;
      width: 100vw;
      height: 100vh;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 100%;
      opacity: 0.8;
      animation: twinkle 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .center-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 20px white;
      z-index: 2;
      transition: transform 0.3s, z-index 0.3s;
    }

    .center-image:hover {
      transform: translate(-50%, -50%) scale(4);
      z-index: 100;
    }

    .orbiting-image {
      position: absolute;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.3s, z-index 0.3s;
      z-index: 1;
      transform-origin: center center;
    }

    .orbiting-image:hover {
      transform: scale(8);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <img src="images_7.png" class="center-image" />
  </div>

  <script>
    const scene = document.getElementById('scene');

    const orbitImages = [
      "images_6.png",
      "images_0.png",
      "images_2.png",
      "images_3.png",
      "images_4.png",
      "images_5.png",
    ];

    const orbiters = [];
    orbitImages.forEach((src, index) => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'orbiting-image';

      const angle = Math.random() * 2 * Math.PI;
      const radius = 200 + index * 150;
      const speed = 0.0001 + Math.random() * 0.0002;

      const orbiter = { img, angle, radius, speed, paused: false };
      orbiters.push(orbiter);

      img.addEventListener("mouseenter", () => { orbiter.paused = true; });
      img.addEventListener("mouseleave", () => { orbiter.paused = false; });

      scene.appendChild(img);
    });

    function animateOrbiters() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      orbiters.forEach(orbiter => {
        if (!orbiter.paused) {
          orbiter.angle += orbiter.speed * 16;
        }
        const x = centerX + orbiter.radius * Math.cos(orbiter.angle) - 50;
        const y = centerY + orbiter.radius * Math.sin(orbiter.angle) - 50;
        orbiter.img.style.left = `${x}px`;
        orbiter.img.style.top = `${y}px`;
      });

      requestAnimationFrame(animateOrbiters);
    }
    requestAnimationFrame(animateOrbiters);

    // Twinkling stars
    const starCount = 150;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 5 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.top = `${Math.random() * window.innerHeight}px`;
      star.style.left = `${Math.random() * window.innerWidth}px`;
      star.style.animationDuration = `${1 + Math.random() * 3}s`;
      document.body.appendChild(star);
    }
  </script>
</body>
</html>
