<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbiting Stars Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .scene {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      width: 100vw;
      height: 100vh;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .center-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 20px white;
      z-index: 2;
      transition: transform 0.3s, z-index 0.3s;
    }

    .center-image.enlarged {
      transform: translate(-50%, -50%) scale(2);
      z-index: 100;
    }

    .orbiting-image {
      position: absolute;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.3s, z-index 0.3s;
      z-index: 1;
      transform-origin: center center;
    }

    .orbiting-image.enlarged {
      transform: scale(2);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <img src="images_7.png" class="center-image" id="centerImg" />
  </div>

  <script>
    const scene = document.getElementById('scene');
    const centerImg = document.getElementById('centerImg');

    // Touch toggle for center image
    centerImg.addEventListener("click", () => {
      centerImg.classList.toggle("enlarged");
    });

    const orbitImages = [
      "images_0.png",
      "images_2.png",
      "images_3.png",
      "images_4.png",
      "images_5.png",
      "images_6.png",
    ];

    const orbiters = [];
    orbitImages.forEach((src, index) => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'orbiting-image';

      const angle = Math.random() * 2 * Math.PI;
      const radius = 150 + index * 130;
      const speed = 0.00015 + Math.random() * 0.0002;

      const orbiter = { img, angle, radius, speed, paused: false };
      orbiters.push(orbiter);

      // Toggle pause/zoom on tap (mobile-friendly)
      img.addEventListener("click", () => {
        orbiter.paused = !orbiter.paused;
        img.classList.toggle("enlarged");
      });

      scene.appendChild(img);
    });

    function animateOrbiters() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      orbiters.forEach(orbiter => {
        if (!orbiter.paused) {
          orbiter.angle += orbiter.speed * 16;
        }
        const x = centerX + orbiter.radius * Math.cos(orbiter.angle) - 40;
        const y = centerY + orbiter.radius * Math.sin(orbiter.angle) - 40;
        orbiter.img.style.left = `${x}px`;
        orbiter.img.style.top = `${y}px`;
      });

      requestAnimationFrame(animateOrbiters);
    }
    requestAnimationFrame(animateOrbiters);

    // Twinkling stars
// Twinkling stars — now covers a bigger virtual sky
const starCount = 400;
for (let i = 0; i < starCount; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  // Place stars over a much larger background canvas
  star.style.top = `${Math.random() * window.innerHeight * 3 - window.innerHeight}px`;
  star.style.left = `${Math.random() * window.innerWidth * 3 - window.innerWidth}px`;

  star.style.animationDuration = `${1 + Math.random() * 3}s`;
  document.body.appendChild(star);
}

    // Resize handling to keep things centered
    window.addEventListener('resize', () => {
      scene.style.width = `${window.innerWidth}px`;
      scene.style.height = `${window.innerHeight}px`;
    });
  </script>
</body>
</html>
